<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<script src="_magpie/bridge.js"></script>
<script src="panel.js" defer></script>
</head>
<body>
<p id="summary" class="muted">…</p>
<p id="result" class="result" role="status" aria-live="polite" hidden></p>
<p class="muted small">
  额度管家只读 magpie 自己的配置文件，把读到的额度显示在 Usage 卡片上。
  它不会把你的令牌、账号或任何站点信息发往别处——所有请求都只发给你自己
  配置的那些站点，也不上传任何数据。没有登录，没有信息泄露。
</p>
<button type="button" id="import">一键导入全部站点</button>
<p class="muted small" id="hint">
  从 magpie 已配置的 provider（providers.json / plugin-providers.json）里，
  把带 key 的 new-api / sub2api 站点导入额度管家。导入不联网，凭据留在本机。
</p>
</body>
</html>
